<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FABLEROOM Rugs</title>
<style>html,body{margin:0;background:#fff}#boot{font-family:Arial,sans-serif;padding:24px;color:#1a1a1a;font-size:13px}</style>
</head>
<body>
<div id="boot">Loading FableRoom…</div>
<script>
(async function(){
  const BASE_COMMIT='c09dc1d5a6a892eb2af04da8084512a77cfebdb8';
  const SOURCE='https://raw.githubusercontent.com/vinitsingh-del/RUB-Merch-2/'+BASE_COMMIT+'/index.html';
  const res=await fetch(SOURCE,{cache:'no-store'});
  if(!res.ok) throw new Error('Unable to load base page');
  let html=await res.text();

  const scopedCss=`
<style id="requested-compare-rugfinder-patch">
/* Requested change only: compact Rug Finder (~20% smaller) */
.rug-finder__shell{max-width:1056px;margin-inline:auto;grid-template-columns:minmax(256px,.75fr) minmax(0,1.25fr)!important}
.rug-finder__media{min-height:472px!important;overflow:hidden}
.rug-finder__media picture{display:block;width:100%;height:100%}
.rug-finder__media img{width:100%;height:100%;object-fit:cover;object-position:center 38%}
.rug-finder__body{padding:clamp(21px,3.2vw,42px)!important}
.rug-finder__body h2{font-size:clamp(27px,3.2vw,39px)!important;margin:6px 0!important}
.rug-finder__body>p{font-size:12px!important;margin-bottom:14px!important}
.rug-finder__step{padding:10px 0!important}
.rug-finder__option{min-height:32px!important;padding:6px!important;font-size:9px!important}
.rug-finder__result{margin-top:10px!important;padding:11px!important}
.rug-finder__result a{padding:9px 12px!important}

/* Requested change only: compact compare CTA inside product cards */
.card-compare-cta{display:inline-flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;padding:6px 9px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1;transition:background .25s ease,color .25s ease,border-color .25s ease}
.card-compare-cta:hover,.card-compare-cta.is-selected{background:var(--ink);border-color:var(--ink);color:var(--white)}
.lookaround__card>.card-compare-cta{margin-left:0}
.style-hub__card .card-compare-cta{margin-left:10px;margin-bottom:10px}
.edit__card>.card-compare-cta{margin-top:7px}

.compare-dock{position:fixed;z-index:95;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:12px;min-width:min(480px,calc(100vw - 32px));padding:10px 12px;background:rgba(26,26,26,.96);color:#fff;box-shadow:0 12px 36px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s ease}
.compare-dock.is-open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.compare-dock__text{flex:1;font:700 10px/1.3 var(--sans);letter-spacing:.04em}
.compare-dock__open,.compare-dock__clear{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;padding:7px 10px;font:700 8.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.compare-dock__open{background:#fff;color:#1a1a1a;border-color:#fff}
.compare-dock__open:disabled{opacity:.45;cursor:not-allowed}

.compare-modal{position:fixed;z-index:110;inset:0;display:none;background:rgba(18,16,13,.52);padding:clamp(16px,4vw,48px);align-items:center;justify-content:center}
.compare-modal.is-open{display:flex}
.compare-modal__panel{width:min(980px,100%);max-height:min(78vh,720px);overflow:auto;background:var(--cream);border:1px solid var(--line-strong);box-shadow:0 24px 70px rgba(0,0,0,.22)}
.compare-modal__head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 20px;background:var(--cream);border-bottom:1px solid var(--line)}
.compare-modal__head h2{font-size:clamp(22px,3vw,32px)}
.compare-modal__close{border:0;background:transparent;font-size:24px;line-height:1;padding:4px 6px}
.compare-modal__scroll{overflow:auto}
.compare-modal table{width:100%;border-collapse:collapse;min-width:620px}
.compare-modal th,.compare-modal td{padding:13px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:11px}
.compare-modal th:first-child,.compare-modal td:first-child{position:sticky;left:0;background:var(--cream);z-index:1;width:120px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:9px}
.compare-modal thead th{font-family:var(--serif);font-size:16px;font-weight:400;text-transform:none;letter-spacing:0}
.compare-modal .compare-note{padding:12px 16px;margin:0;color:var(--ink-soft);font-size:10px}

@media(max-width:760px){
 .rug-finder__shell{max-width:100%;grid-template-columns:1fr!important}
 .rug-finder__media{min-height:256px!important}
 .rug-finder__body{padding:16px 0 2px!important}
 .rug-finder__body h2{font-size:25px!important}
 .rug-finder__option{min-height:34px!important}
 .compare-dock{bottom:10px;gap:7px;padding:9px 10px}
 .compare-dock__clear{display:none}
 .card-compare-cta{font-size:8px;padding:6px 8px}
}
</style>`;

  const scopedJs=`
<script id="requested-compare-rugfinder-script">
(function(){
  function initRequestedChanges(){
    /* 1. Capture factual compare information already present, then remove standalone section. */
    const factualByName=new Map();
    const oldCompare=document.querySelector('.compare-shop');
    if(oldCompare){
      oldCompare.querySelectorAll('.compare-card').forEach(card=>{
        const name=(card.querySelector('h3')?.textContent||'').trim();
        const spec=(card.querySelector('.compare-card__spec')?.textContent||'').trim();
        const price=(card.querySelector('.compare-card__price')?.textContent||'').trim();
        if(name){ factualByName.set(normalizeName(name),{spec,price}); }
      });
      oldCompare.remove();
    }

    /* 2. Rename + compact Rug Finder and use the same hero-model artwork as the hero banner. */
    const finder=document.querySelector('.rug-finder');
    if(finder){
      const eyebrow=finder.querySelector('.eyebrow');
      if(eyebrow) eyebrow.textContent='Rug Finder';
      const media=finder.querySelector('.rug-finder__media');
      if(media){
        media.innerHTML='<picture><source media="(max-width:760px)" srcset="assets/hero-spotlight-01-mobile.webp"><img src="assets/hero-spotlight-01-desktop.webp" alt="FableRoom hero model styling a handmade rug" loading="lazy"></picture>';
      }
    }

    function normalizeName(v){
      return String(v||'').toLowerCase().replace(/&/g,'and').replace(/hand[ -]?tufted/g,'hand tufted').replace(/hand[ -]?knotted/g,'hand knotted').replace(/hand[ -]?woven/g,'hand woven').replace(/[^a-z0-9]+/g,' ').trim();
    }
    function moneyNumber(text){
      const m=String(text||'').replace(/,/g,'').match(/£\s*(\d+(?:\.\d+)?)/);
      return m?Number(m[1]):null;
    }
    function titleFromCard(card){
      return (card.querySelector('h3,h4')?.textContent||card.querySelector('img')?.alt||'Rug').trim();
    }
    function getExistingProductCards(){
      const nodes=[...document.querySelectorAll('.lookaround__card,.style-hub__card,.edit__card')];
      return [...new Set(nodes)].filter(card=>titleFromCard(card));
    }

    /* Build a factual index only from text already on this page. */
    const aggregate=new Map();
    getExistingProductCards().forEach(card=>{
      const name=titleFromCard(card), key=normalizeName(name);
      if(!aggregate.has(key)) aggregate.set(key,{name,price:'—',saving:'—',technique:'—',material:'—',style:'—',size:'See PDP',thickness:'See PDP'});
      const data=aggregate.get(key);
      const txt=card.textContent||'';
      const priceEl=card.querySelector('.lookaround__price b,.price-row b,small');
      if(priceEl && /£/.test(priceEl.textContent||'')) data.price=(priceEl.textContent||'').trim().replace(/^From\s*/i,'');
      const savingMatch=txt.match(/(\d{1,2})%\s*off/i);
      if(savingMatch) data.saving=savingMatch[1]+'%';
      if(data.saving==='—'){
        const current=moneyNumber(card.querySelector('.price-row b,.lookaround__price b')?.textContent);
        const was=moneyNumber(card.querySelector('.price-row s,.lookaround__price s')?.textContent);
        if(current&&was&&was>current) data.saving=Math.round((1-current/was)*100)+'%';
      }
      const tag=card.querySelector('.style-hub__card span,span')?.textContent?.trim();
      if(card.matches('.style-hub__card') && tag) data.style=tag;
      const fact=[...factualByName.entries()].find(([k])=>k===key || k.includes(key) || key.includes(k));
      if(fact){
        const spec=fact[1].spec||'';
        const bits=spec.split('·').map(s=>s.trim()).filter(Boolean);
        if(bits[0]) data.technique=bits[0];
        if(bits[1]) data.material=bits[1];
        if(data.price==='—'&&fact[1].price) data.price=fact[1].price;
      }
      if(data.technique==='—'){
        const m=name.match(/Hand[- ]?(Tufted|Knotted|Woven)|Washable/i);
        if(m) data.technique=m[0].replace(/Hand\s+/i,'Hand-');
      }
      if(data.material==='—'){
        const mats=[];
        if(/\bwool\b/i.test(name)) mats.push('Wool');
        if(/\bjute\b/i.test(name)) mats.push('Jute');
        if(/bamboo silk/i.test(name)) mats.push('Bamboo silk');
        if(mats.length) data.material=mats.join(' + ');
      }
    });

    /* Cross-fill style/price/savings between repeated instances of the same product. */
    getExistingProductCards().forEach(card=>{
      const key=normalizeName(titleFromCard(card));
      const data=aggregate.get(key);
      if(!data) return;
      const tag=card.matches('.style-hub__card') ? card.querySelector('span')?.textContent?.trim() : '';
      if(tag) data.style=tag;
    });

    const selected=[];
    const dock=document.createElement('div');
    dock.className='compare-dock';
    dock.innerHTML='<div class="compare-dock__text"><span data-compare-count>0 rugs selected</span></div><button class="compare-dock__clear" type="button">Clear</button><button class="compare-dock__open" type="button" disabled>Compare</button>';
    document.body.appendChild(dock);

    const modal=document.createElement('div');
    modal.className='compare-modal';
    modal.setAttribute('role','dialog');
    modal.setAttribute('aria-modal','true');
    modal.setAttribute('aria-label','Compare selected rugs');
    modal.innerHTML='<div class="compare-modal__panel"><div class="compare-modal__head"><div><div class="eyebrow">Rug Comparison</div><h2>Compare your rugs.</h2></div><button class="compare-modal__close" type="button" aria-label="Close comparison">×</button></div><div class="compare-modal__scroll" data-compare-table></div><p class="compare-note">Only details already available on this page are shown. Size or thickness that is not stated here is marked “See PDP”.</p></div>';
    document.body.appendChild(modal);

    function sync(){
      document.querySelectorAll('.card-compare-cta').forEach(btn=>{
        const active=selected.includes(btn.dataset.compareKey);
        btn.classList.toggle('is-selected',active);
        btn.setAttribute('aria-pressed',String(active));
        btn.textContent=active?'Added ✓':'Compare now +';
      });
      dock.classList.toggle('is-open',selected.length>0);
      dock.querySelector('[data-compare-count]').textContent=selected.length+' rug'+(selected.length===1?'':'s')+' selected';
      const open=dock.querySelector('.compare-dock__open');
      open.disabled=selected.length<2;
      open.textContent=selected.length>=2?'Compare ('+selected.length+')':'Compare';
    }
    function toggle(key){
      const i=selected.indexOf(key);
      if(i>=0) selected.splice(i,1);
      else if(selected.length<3) selected.push(key);
      else return;
      sync();
    }

    getExistingProductCards().forEach(card=>{
      const name=titleFromCard(card), key=normalizeName(name);
      if(!aggregate.has(key) || card.querySelector('.card-compare-cta')) return;
      const btn=document.createElement('button');
      btn.type='button'; btn.className='card-compare-cta'; btn.dataset.compareKey=key; btn.setAttribute('aria-pressed','false'); btn.textContent='Compare now +';
      btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggle(key);});
      if(card.matches('.style-hub__card')){
        const info=card.querySelector('div');
        if(info) info.appendChild(btn); else card.appendChild(btn);
      }else{
        card.appendChild(btn);
      }
    });

    function renderTable(){
      const rows=[['Size','size'],['Technique','technique'],['Material','material'],['Price','price'],['Savings','saving'],['Thickness','thickness'],['Style','style']];
      const items=selected.map(k=>aggregate.get(k)).filter(Boolean);
      const head='<thead><tr><th>Detail</th>'+items.map(x=>'<th>'+escapeHtml(x.name)+'</th>').join('')+'</tr></thead>';
      const body='<tbody>'+rows.map(([label,field])=>'<tr><td>'+label+'</td>'+items.map(x=>'<td>'+escapeHtml(x[field]||'—')+'</td>').join('')+'</tr>').join('')+'</tbody>';
      modal.querySelector('[data-compare-table]').innerHTML='<table>'+head+body+'</table>';
    }
    function escapeHtml(v){return String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}

    dock.querySelector('.compare-dock__clear').addEventListener('click',()=>{selected.splice(0);sync();});
    dock.querySelector('.compare-dock__open').addEventListener('click',()=>{if(selected.length<2)return;renderTable();modal.classList.add('is-open');document.body.style.overflow='hidden';});
    modal.querySelector('.compare-modal__close').addEventListener('click',closeModal);
    modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('is-open'))closeModal();});
    function closeModal(){modal.classList.remove('is-open');document.body.style.overflow='';}
    sync();
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initRequestedChanges,{once:true});
  else initRequestedChanges();
})();
<\/script>`;

  html=html.replace('</head>',scopedCss+'\n</head>');
  html=html.replace('</body>',scopedJs+'\n</body>');
  document.open();
  document.write(html);
  document.close();
})().catch(function(err){
  document.getElementById('boot').textContent='Unable to load the page. Please refresh.';
  console.error(err);
});
</script>
</body>
</html>
